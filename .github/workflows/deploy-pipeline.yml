name: Deploy Identity Threat Pipeline
on:
  push:
    branches: [ main ]

jobs:
  deploy:
    runs-on: [self-hosted, Windows, lab-k8s]
    steps:
      - uses: actions/checkout@v3

      - name: Hardening & Linting
        shell: cmd
        run: |
          if not exist auto_format_and_send_alerts.ps1 (
            echo auto_format_and_send_alerts.ps1 is missing.
            exit /b 1
          )

      - name: Preflight SSH deployment readiness
        id: preflight
        env:
          SSH_PRIVATE_KEY: ${{ secrets.SOC_SERVER_KEY }}
          SOC_SERVER_HOST: ${{ secrets.SOC_SERVER_HOST }}
          SOC_SERVER_USER: ${{ secrets.SOC_SERVER_USER }}
          SOC_DEPLOY_PATH: ${{ secrets.SOC_DEPLOY_PATH }}
          SOC_DEPLOY_STRICT: ${{ vars.SOC_DEPLOY_STRICT }}
        shell: pwsh
        run: |
          $canDeploy = $true

          if ([string]::IsNullOrWhiteSpace($env:SSH_PRIVATE_KEY)) {
            Write-Host "::warning::SOC_SERVER_KEY is not configured. SSH deploy will be skipped."
            $canDeploy = $false
          }

          if ([string]::IsNullOrWhiteSpace($env:SOC_SERVER_HOST)) {
            Write-Host "::warning::SOC_SERVER_HOST is not configured. SSH deploy will be skipped."
            $canDeploy = $false
          }

          if ([string]::IsNullOrWhiteSpace($env:SOC_SERVER_USER)) {
            Write-Host "::warning::SOC_SERVER_USER is not configured. SSH deploy will be skipped."
            $canDeploy = $false
          }

          if ([string]::IsNullOrWhiteSpace($env:SOC_DEPLOY_PATH)) {
            Write-Host "::warning::SOC_DEPLOY_PATH is not configured. SSH deploy will be skipped."
            $canDeploy = $false
          }

          if ($canDeploy) {
            $client = New-Object System.Net.Sockets.TcpClient
            try {
              $async = $client.BeginConnect($env:SOC_SERVER_HOST, 22, $null, $null)
              $reachable = $async.AsyncWaitHandle.WaitOne(5000)
              if ($reachable) {
                $client.EndConnect($async)
              }
            } catch {
              $reachable = $false
            } finally {
              $client.Close()
            }

            if ($reachable) {
              Write-Host "::notice::SSH target reachable on port 22."
            } else {
              Write-Host "::warning::SSH target $($env:SOC_SERVER_HOST):22 is unreachable. SSH deploy will be skipped."
              $canDeploy = $false
            }
          }

          "can_deploy=$($canDeploy.ToString().ToLower())" >> $env:GITHUB_OUTPUT

          if ((-not $canDeploy) -and ($env:SOC_DEPLOY_STRICT -eq 'true')) {
            Write-Error 'SOC_DEPLOY_STRICT=true and SSH deployment prerequisites are not met.'
          }

      - name: Prepare SSH key
        if: steps.preflight.outputs.can_deploy == 'true'
        env:
          SSH_PRIVATE_KEY: ${{ secrets.SOC_SERVER_KEY }}
        shell: pwsh
        run: |
          $sshDir = Join-Path $HOME '.ssh'
          $null = New-Item -Path $sshDir -ItemType Directory -Force
          $keyPath = Join-Path $sshDir 'id_rsa'
          Set-Content -Path $keyPath -Value $env:SSH_PRIVATE_KEY -NoNewline

      - name: Deploy to Command Center
        if: steps.preflight.outputs.can_deploy == 'true'
        env:
          SSH_PRIVATE_KEY: ${{ secrets.SOC_SERVER_KEY }}
          SOC_SERVER_HOST: ${{ secrets.SOC_SERVER_HOST }}
          SOC_SERVER_USER: ${{ secrets.SOC_SERVER_USER }}
          SOC_DEPLOY_PATH: ${{ secrets.SOC_DEPLOY_PATH }}
        shell: pwsh
        run: |
          $keyPath = Join-Path (Join-Path $HOME '.ssh') 'id_rsa'
          $scp = (Get-Command scp -ErrorAction SilentlyContinue).Source
          if (-not $scp) {
            $scp = 'C:\Windows\System32\OpenSSH\scp.exe'
          }
          if (-not (Test-Path $scp)) {
            throw 'scp executable not found on runner.'
          }

          & $scp -o StrictHostKeyChecking=no -i $keyPath ./auto_format_and_send_alerts.ps1 "$($env:SOC_SERVER_USER)@$($env:SOC_SERVER_HOST):$($env:SOC_DEPLOY_PATH)"
          if ($LASTEXITCODE -ne 0) {
            throw "scp failed with exit code $LASTEXITCODE"
          }

      - name: Deployment skipped summary
        if: steps.preflight.outputs.can_deploy != 'true'
        run: |
          echo "::notice::Deploy Identity Threat Pipeline completed in safe-skip mode."
          echo "::notice::Primary security gates remain unaffected (deploy.yml and opa-policy-enforce.yml)."
