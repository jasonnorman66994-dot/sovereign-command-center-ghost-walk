name: Deploy Identity Threat Pipeline
on:
  push:
    branches: [ main ]

jobs:
  deploy:
    runs-on: [self-hosted, linux, ubuntu-soc]
    steps:
      - uses: actions/checkout@v3

      - name: Hardening & Linting
        shell: bash
        run: |
          if [ ! -f auto_format_and_send_alerts.ps1 ]; then
            echo "auto_format_and_send_alerts.ps1 is missing."
            exit 1
          fi

      - name: Preflight SSH deployment readiness
        id: preflight
        env:
          SSH_PRIVATE_KEY: ${{ secrets.SOC_SERVER_KEY }}
          SOC_SERVER_HOST: ${{ secrets.SOC_SERVER_HOST }}
          SOC_SERVER_USER: ${{ secrets.SOC_SERVER_USER }}
          SOC_DEPLOY_PATH: ${{ secrets.SOC_DEPLOY_PATH }}
          SOC_DEPLOY_STRICT: ${{ vars.SOC_DEPLOY_STRICT }}
        shell: bash
        run: |
          can_deploy=true

          if [ -z "$SSH_PRIVATE_KEY" ]; then
            echo "::warning::SOC_SERVER_KEY is not configured. SSH deploy will be skipped."
            can_deploy=false
          fi

          if [ -z "$SOC_SERVER_HOST" ]; then
            echo "::warning::SOC_SERVER_HOST is not configured. SSH deploy will be skipped."
            can_deploy=false
          fi

          if [ -z "$SOC_SERVER_USER" ]; then
            echo "::warning::SOC_SERVER_USER is not configured. SSH deploy will be skipped."
            can_deploy=false
          fi

          if [ -z "$SOC_DEPLOY_PATH" ]; then
            echo "::warning::SOC_DEPLOY_PATH is not configured. SSH deploy will be skipped."
            can_deploy=false
          fi

          if [ "$can_deploy" = "true" ]; then
            if timeout 5 bash -c "</dev/tcp/$SOC_SERVER_HOST/22" 2>/dev/null; then
              echo "::notice::SSH target reachable on port 22."
            else
              echo "::warning::SSH target $SOC_SERVER_HOST:22 is unreachable. SSH deploy will be skipped."
              can_deploy=false
            fi
          fi

          echo "can_deploy=$can_deploy" >> "$GITHUB_OUTPUT"

          if [ "$can_deploy" != "true" ] && [ "$SOC_DEPLOY_STRICT" = "true" ]; then
            echo "::error::SOC_DEPLOY_STRICT=true and SSH deployment prerequisites are not met."
            exit 1
          fi

      - name: Prepare SSH key
        if: steps.preflight.outputs.can_deploy == 'true'
        env:
          SSH_PRIVATE_KEY: ${{ secrets.SOC_SERVER_KEY }}
        shell: bash
        run: |
          install -m 700 -d ~/.ssh
          # Write key ensuring proper PEM line endings (echo adds required trailing newline)
          printf '%s\n' "$SSH_PRIVATE_KEY" | tr -d '\r' > ~/.ssh/id_rsa
          chmod 600 ~/.ssh/id_rsa
          # Validate key is parseable
          if ! ssh-keygen -y -f ~/.ssh/id_rsa > ~/.ssh/id_rsa.pub 2>/tmp/keygen_err; then
            echo "::error::SSH private key is invalid or malformed: $(cat /tmp/keygen_err)"
            exit 1
          fi
          echo "::notice::SSH key validated successfully ($(ssh-keygen -l -f ~/.ssh/id_rsa.pub 2>/dev/null | awk '{print $1,$4}'))"

      - name: Deploy to Command Center
        if: steps.preflight.outputs.can_deploy == 'true'
        env:
          SOC_SERVER_HOST: ${{ secrets.SOC_SERVER_HOST }}
          SOC_SERVER_USER: ${{ secrets.SOC_SERVER_USER }}
          SOC_DEPLOY_PATH: ${{ secrets.SOC_DEPLOY_PATH }}
        shell: bash
        run: |
          # Verbose SSH test to surface auth rejection details
          echo "::group::SSH connectivity test (verbose)"
          ssh -v -o StrictHostKeyChecking=no -o BatchMode=yes \
              -o ConnectTimeout=10 -i ~/.ssh/id_rsa \
              "${SOC_SERVER_USER}@${SOC_SERVER_HOST}" echo 'SSH_OK' 2>&1 || true
          echo "::endgroup::"
          # Upload file through SSH stdin to avoid Windows OpenSSH scp/sftp subsystem issues.
          ssh -v -o StrictHostKeyChecking=no -o ConnectTimeout=10 \
              -i ~/.ssh/id_rsa \
              "${SOC_SERVER_USER}@${SOC_SERVER_HOST}" \
              "powershell -NoProfile -NonInteractive -Command \"\$dest='${SOC_DEPLOY_PATH}'; if (-not [System.IO.Path]::IsPathRooted(\$dest)) { \$dest = Join-Path \$env:USERPROFILE \$dest }; \$dir = Split-Path -Parent \$dest; if (\$dir) { New-Item -ItemType Directory -Force -Path \$dir | Out-Null }; \$content = [Console]::In.ReadToEnd(); [System.IO.File]::WriteAllText(\$dest, \$content, [System.Text.UTF8Encoding]::new(\$false)); Write-Host ('DEPLOYED ' + \$dest)\"" \
              < ./auto_format_and_send_alerts.ps1

      - name: Deployment skipped summary
        if: steps.preflight.outputs.can_deploy != 'true'
        shell: bash
        run: |
          echo "::notice::Deploy Identity Threat Pipeline completed in safe-skip mode."
          echo "::notice::Primary security gates remain unaffected (deploy.yml and opa-policy-enforce.yml)."
