name: Deploy Identity Threat Pipeline
on:
  push:
    branches: [ main ]

jobs:
  deploy:
    runs-on: [self-hosted, Windows, lab-k8s]
    steps:
      - uses: actions/checkout@v3

      - name: Hardening & Linting
        shell: cmd
        run: |
          if not exist auto_format_and_send_alerts.ps1 (
            echo auto_format_and_send_alerts.ps1 is missing.
            exit /b 1
          )

      - name: Preflight SSH deployment readiness
        id: preflight
        env:
          SSH_PRIVATE_KEY: ${{ secrets.SOC_SERVER_KEY }}
          SOC_SERVER_HOST: ${{ secrets.SOC_SERVER_HOST }}
          SOC_SERVER_USER: ${{ secrets.SOC_SERVER_USER }}
          SOC_DEPLOY_PATH: ${{ secrets.SOC_DEPLOY_PATH }}
          SOC_DEPLOY_STRICT: ${{ vars.SOC_DEPLOY_STRICT }}
        shell: cmd
        run: |
          @echo off
          set "can_deploy=true"

          if "%SSH_PRIVATE_KEY%"=="" (
            echo ::warning::SOC_SERVER_KEY is not configured. SSH deploy will be skipped.
            set "can_deploy=false"
          )

          if "%SOC_SERVER_HOST%"=="" (
            echo ::warning::SOC_SERVER_HOST is not configured. SSH deploy will be skipped.
            set "can_deploy=false"
          )

          if "%SOC_SERVER_USER%"=="" (
            echo ::warning::SOC_SERVER_USER is not configured. SSH deploy will be skipped.
            set "can_deploy=false"
          )

          if "%SOC_DEPLOY_PATH%"=="" (
            echo ::warning::SOC_DEPLOY_PATH is not configured. SSH deploy will be skipped.
            set "can_deploy=false"
          )

          if /I "%can_deploy%"=="true" (
            powershell -NoLogo -NoProfile -NonInteractive -ExecutionPolicy Bypass -Command "$c=New-Object System.Net.Sockets.TcpClient; try { $a=$c.BeginConnect('%SOC_SERVER_HOST%',22,$null,$null); if($a.AsyncWaitHandle.WaitOne(5000)){ $c.EndConnect($a); exit 0 } else { exit 1 } } catch { exit 1 } finally { $c.Close() }"
            if errorlevel 1 (
              echo ::warning::SSH target %SOC_SERVER_HOST%:22 is unreachable. SSH deploy will be skipped.
              set "can_deploy=false"
            ) else (
              echo ::notice::SSH target reachable on port 22.
            )
          )

          echo can_deploy=%can_deploy%>> "%GITHUB_OUTPUT%"

          if /I "%can_deploy%" NEQ "true" if /I "%SOC_DEPLOY_STRICT%"=="true" (
            echo ::error::SOC_DEPLOY_STRICT=true and SSH deployment prerequisites are not met.
            exit /b 1
          )

      - name: Prepare SSH key
        if: steps.preflight.outputs.can_deploy == 'true'
        env:
          SSH_PRIVATE_KEY: ${{ secrets.SOC_SERVER_KEY }}
        shell: cmd
        run: |
          @echo off
          if not exist "%USERPROFILE%\.ssh" mkdir "%USERPROFILE%\.ssh"
          powershell -NoLogo -NoProfile -NonInteractive -ExecutionPolicy Bypass -Command "[System.IO.File]::WriteAllText($env:USERPROFILE + '\\.ssh\\id_rsa', $env:SSH_PRIVATE_KEY)"

      - name: Deploy to Command Center
        if: steps.preflight.outputs.can_deploy == 'true'
        env:
          SSH_PRIVATE_KEY: ${{ secrets.SOC_SERVER_KEY }}
          SOC_SERVER_HOST: ${{ secrets.SOC_SERVER_HOST }}
          SOC_SERVER_USER: ${{ secrets.SOC_SERVER_USER }}
          SOC_DEPLOY_PATH: ${{ secrets.SOC_DEPLOY_PATH }}
        shell: cmd
        run: |
          @echo off
          set "SCP_EXE=scp"
          where scp >nul 2>nul || set "SCP_EXE=C:\Windows\System32\OpenSSH\scp.exe"
          if not exist "%SCP_EXE%" (
            echo scp executable not found on runner.
            exit /b 1
          )

          "%SCP_EXE%" -o StrictHostKeyChecking=no -i "%USERPROFILE%\.ssh\id_rsa" .\auto_format_and_send_alerts.ps1 "%SOC_SERVER_USER%@%SOC_SERVER_HOST%:%SOC_DEPLOY_PATH%"
          if errorlevel 1 exit /b 1

      - name: Deployment skipped summary
        if: steps.preflight.outputs.can_deploy != 'true'
        run: |
          echo "::notice::Deploy Identity Threat Pipeline completed in safe-skip mode."
          echo "::notice::Primary security gates remain unaffected (deploy.yml and opa-policy-enforce.yml)."
