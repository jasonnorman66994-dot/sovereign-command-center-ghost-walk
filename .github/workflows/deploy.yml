name: CI/CD Unified Omni-SOC

on:
  workflow_dispatch:
    inputs:
      log_level:
        description: Log level
        required: true
        default: info
      deploy_target:
        description: Target Environment
        required: true
        default: lab-local

permissions:
  contents: read
  packages: write

jobs:
  build-and-deploy:
    if: ${{ github.event.inputs.deploy_target == 'lab-local' }}
    runs-on: [self-hosted, Windows, lab-k8s]
    env:
      IDENTITY_ENGINE_IMAGE: ghcr.io/${{ github.repository }}/identity-engine:latest
      PHISHING_DETECTOR_IMAGE: ghcr.io/${{ github.repository }}/phishing-detector:latest
      SOVEREIGN_DASHBOARD_IMAGE: ghcr.io/${{ github.repository }}/dashboard:latest
      KUBECONFIG_DATA: ${{ secrets.KUBECONFIG_DATA }}
      TELEGRAM_BOT_TOKEN: ${{ secrets.TELEGRAM_BOT_TOKEN }}
      TELEGRAM_CHAT_ID: ${{ secrets.TELEGRAM_CHAT_ID }}
    steps:
      - uses: actions/checkout@v4

      - name: Validate required secrets
        shell: pwsh
        run: |
          if ([string]::IsNullOrWhiteSpace($env:KUBECONFIG_DATA)) {
            Write-Error "KUBECONFIG_DATA is missing."
          }
          if ([string]::IsNullOrWhiteSpace($env:TELEGRAM_BOT_TOKEN)) {
            Write-Error "TELEGRAM_BOT_TOKEN is missing."
          }
          if ([string]::IsNullOrWhiteSpace($env:TELEGRAM_CHAT_ID)) {
            Write-Error "TELEGRAM_CHAT_ID is missing."
          }

      - name: Set up kubectl
        uses: azure/setup-kubectl@v4
        with:
          version: latest

      - name: Set up Kubeconfig
        shell: pwsh
        run: |
          New-Item -ItemType Directory -Force -Path "$HOME/.kube" | Out-Null
          [IO.File]::WriteAllBytes("$HOME/.kube/config", [Convert]::FromBase64String($env:KUBECONFIG_DATA))

      - name: Verify local lab cluster endpoint
        shell: pwsh
        run: |
          $apiServer = kubectl config view --minify -o jsonpath='{.clusters[0].cluster.server}'
          Write-Host "api_server=$apiServer"
          if ($apiServer -notmatch '^https://(127\.0\.0\.1|localhost):') {
            Write-Error "lab-local deploy expects a localhost Kubernetes API."
          }

      - name: Verify Docker availability
        shell: pwsh
        run: docker version

      - name: Log in to GHCR
        shell: pwsh
        run: |
          $token = "${{ github.token }}"
          $token | docker login ghcr.io -u "${{ github.actor }}" --password-stdin

      - name: Build and push identity engine
        shell: pwsh
        run: |
          docker build -f deploy/docker/Dockerfile.identity-engine -t $env:IDENTITY_ENGINE_IMAGE .
          docker push $env:IDENTITY_ENGINE_IMAGE

      - name: Build and push phishing detector
        shell: pwsh
        run: |
          docker build -f deploy/docker/Dockerfile.phishing-detector -t $env:PHISHING_DETECTOR_IMAGE .
          docker push $env:PHISHING_DETECTOR_IMAGE

      - name: Build and push sovereign dashboard
        shell: pwsh
        run: |
          docker build -t $env:SOVEREIGN_DASHBOARD_IMAGE scaffold-sveltekit/dashboard-sveltekit
          docker push $env:SOVEREIGN_DASHBOARD_IMAGE

      - name: Sync Telegram secret
        shell: pwsh
        run: |
          kubectl create secret generic telegram-secrets `
            --from-literal=bot-token="$env:TELEGRAM_BOT_TOKEN" `
            --from-literal=chat-id="$env:TELEGRAM_CHAT_ID" `
            --dry-run=client -o yaml | kubectl apply -f -

      - name: Deploy unified Omni-SOC stack
        shell: pwsh
        run: |
          $deployment = Get-Content k8s/deployment.yaml -Raw
          $deployment = $deployment.Replace('<IDENTITY_ENGINE_IMAGE>', $env:IDENTITY_ENGINE_IMAGE)
          $deployment = $deployment.Replace('<PHISHING_DETECTOR_IMAGE>', $env:PHISHING_DETECTOR_IMAGE)
          $deployment = $deployment.Replace('<SOVEREIGN_DASHBOARD_IMAGE>', $env:SOVEREIGN_DASHBOARD_IMAGE)
          $deployment | kubectl apply -f -
          kubectl apply -f k8s/service.yaml
          kubectl apply -f k8s/ingress.yaml

      - name: Wait for rollout
        shell: pwsh
        run: kubectl rollout status deployment/omni-soc-production --timeout=300s
