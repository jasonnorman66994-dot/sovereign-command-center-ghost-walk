apiVersion: networking.k8s.io/v1
kind: Ingress
metadata:
  name: omni-soc-dashboard
  annotations:
    nginx.ingress.kubernetes.io/rewrite-target: /
spec:
  rules:
  - host: omni-soc.local
    http:
      paths:
      - path: /
        pathType: Prefix
        backend:
          service:
            name: omni-soc-dashboard
            port:
              number: 80
